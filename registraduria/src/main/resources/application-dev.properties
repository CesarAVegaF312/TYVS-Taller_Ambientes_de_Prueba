# =====================================================================
# Perfil dev: la maquina del desarrollador y las pruebas sin Docker.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:registraduria;DB_CLOSE_DELAY=-1

# En dev, ademas del esquema, se cargan datos semilla para poder probar a mano.
# En prod NO: ver application-prod.properties y el modulo 4.
spring.flyway.locations=classpath:db/migration,classpath:db/semilla

# Valor de desarrollo, publico a proposito y sin ningun valor real. Que este
# escrito aqui no es un problema; que este escrito en application-prod si lo
# seria, y SecretosPorAmbienteTest lo comprueba.
registraduria.clave-auditoria=solo-para-desarrollo-local

management.endpoint.health.show-details=always
