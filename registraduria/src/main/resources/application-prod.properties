# =====================================================================
# Perfil prod: PostgreSQL, y TODO lo sensible llega por variables de entorno.
#
# Ningun ${...} de este archivo tiene valor por defecto (la forma
# ${VARIABLE:valor}). Es una decision, no un descuido: si falta la variable,
# la aplicacion NO arranca. Un valor por defecto aqui significaria que un
# despliegue mal configurado arranca igual, con una clave que esta publicada
# en el repositorio.
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

registraduria.clave-auditoria=${REGISTRADURIA_CLAVE_AUDITORIA}
