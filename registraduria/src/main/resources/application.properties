# =====================================================================
# Configuracion COMUN a todos los ambientes.
#
# Aqui va solo lo que es igual en todas partes. Lo que cambia entre ambientes
# (base de datos, secretos) va en application-<perfil>.properties. Si una
# propiedad aparece aqui Y en un perfil, gana el perfil: por eso conviene que
# esta lista sea corta y sin sorpresas.
# =====================================================================
spring.application.name=registraduria

# Sin perfil explicito se arranca en dev. Produccion tiene que pedirse a
# proposito (SPRING_PROFILES_ACTIVE=prod), nunca llegar por omision.
spring.profiles.default=dev

# El esquema lo crean SOLO las migraciones (modulo 4).
spring.flyway.locations=classpath:db/migration

# --- Modulo 6: salud del ambiente ---
management.endpoints.web.exposure.include=health,info
# Expone /actuator/health/liveness y /actuator/health/readiness tambien fuera
# de Kubernetes (dentro de Kubernetes se activan solos).
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
