name: Ambientes

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Todas las pruebas. En el runner de GitHub SI hay Docker, asi que las pruebas
  # de Testcontainers que en una maquina sin Docker aparecen omitidas aqui se
  # ejecutan de verdad.
  # ---------------------------------------------------------------------------
  pruebas:
    name: mvn verify (con Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas unitarias, de paridad, de ciclo de vida y smoke
        run: mvn -B verify
        working-directory: registraduria

  # ---------------------------------------------------------------------------
  # El ambiente de DESARROLLO (devcontainer) tambien se prueba: se construye y
  # se corre la suite dentro de el. Si una imagen o feature cambia por fuera
  # (deriva, modulo 1), este job es el primero en enterarse.
  # ---------------------------------------------------------------------------
  devcontainer:
    name: Devcontainer se construye y la suite pasa adentro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir el devcontainer
        run: |
          set -o pipefail
          npx -y @devcontainers/cli@0.89.0 up --workspace-folder . 2>&1 | tee construccion.log
      - name: Correr la suite dentro del devcontainer
        run: |
          set -o pipefail
          npx -y @devcontainers/cli@0.89.0 exec --workspace-folder . bash -lc "cd registraduria && mvn -B verify" 2>&1 | tee suite.log
      # Si algo falla, las lineas de error se publican como anotaciones del
      # check, visibles en el PR sin abrir el log completo.
      - name: Mostrar el error en el PR
        if: failure()
        run: |
          for f in construccion.log suite.log; do
            [ -f "$f" ] && grep -v '^\s*$' "$f" | grep -i -E 'error|fail|unable|denied|not found|E: ' | tail -n 15 | while IFS= read -r l; do echo "::error title=$f::${l:0:900}"; done
          done
          true

  # ---------------------------------------------------------------------------
  # El ambiente completo: se valida el compose, se construye la imagen, se
  # levanta con sus healthchecks y se le pasa el smoke test desde fuera.
  # ---------------------------------------------------------------------------
  ambiente-desplegado:
    name: docker compose + smoke test
    runs-on: ubuntu-latest
    env:
      # Valores de CI, solo para este ambiente efimero. En un proyecto real
      # vendrian de los secrets del repositorio.
      DB_USER: registraduria
      DB_PASSWORD: clave-solo-para-ci
      REGISTRADURIA_CLAVE_AUDITORIA: clave-de-auditoria-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Construir la imagen y levantar el ambiente
        run: docker compose up --build --wait

      - name: Smoke test contra el ambiente desplegado
        run: mvn -B test-compile failsafe:integration-test failsafe:verify -Dit.test=SmokeAmbienteDesplegadoIT -Dambiente.url=http://localhost:8080
        working-directory: registraduria

      - name: Logs del ambiente (si algo fallo)
        if: failure()
        run: docker compose logs

      - name: Bajar el ambiente
        if: always()
        run: docker compose down -v
